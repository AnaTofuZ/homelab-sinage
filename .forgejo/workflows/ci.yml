name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: homelab-signage-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Configure Nix GitHub authentication
        env:
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN }}
        run: |
          umask 077
          : > "$RUNNER_TEMP/nix-user.conf"
          if [ -n "$NIX_GITHUB_TOKEN" ]; then
            printf 'access-tokens = github.com=%s\n' "$NIX_GITHUB_TOKEN" > "$RUNNER_TEMP/nix-user.conf"
          fi
          echo "NIX_USER_CONF_FILES=$RUNNER_TEMP/nix-user.conf" >> "$GITHUB_ENV"
      - name: Publish Nix build results to shared cache
        continue-on-error: true
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/master'
        uses: https://github.com/ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0
        with:
          endpoint: https://nix-cache.home.anatofuz.net/
          cache: shirane
          skip-use: "true"
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - name: Set up locked Go and golangci-lint
        run: |
          nix build .#go --out-link "$RUNNER_TEMP/go"
          nix build .#golangci-lint --out-link "$RUNNER_TEMP/golangci-lint"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/golangci-lint/bin" >> "$GITHUB_PATH"
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache Go dependencies and compilation
        uses: https://data.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-${{ forgejo.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('**/go.sum', '**/go.mod') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-

      - uses: https://data.forgejo.org/actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify generated BarefootJS component
        run: |
          npm run build:ui
          gofmt -w components.go
          git diff --exit-code -- components.go
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Lint Go
        run: golangci-lint run ./...
      - run: go test -race ./...

  nix:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Configure Nix GitHub authentication
        env:
          NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN }}
        run: |
          umask 077
          : > "$RUNNER_TEMP/nix-user.conf"
          if [ -n "$NIX_GITHUB_TOKEN" ]; then
            printf 'access-tokens = github.com=%s\n' "$NIX_GITHUB_TOKEN" > "$RUNNER_TEMP/nix-user.conf"
          fi
          echo "NIX_USER_CONF_FILES=$RUNNER_TEMP/nix-user.conf" >> "$GITHUB_ENV"
      - uses: https://git.home.anatofuz.net/anatofuz/forgejo-actions/update-nix-hashes@main
      - name: Publish Nix build results to shared cache
        continue-on-error: true
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/master'
        uses: https://github.com/ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0
        with:
          endpoint: https://nix-cache.home.anatofuz.net/
          cache: shirane
          skip-use: "true"
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - run: nix fmt -- --ci
      - run: nix run --inputs-from . nixpkgs#statix -- check .
      - run: nix flake check --no-build --all-systems

  deploy:
    needs: [code, nix]
    if: forgejo.event_name == 'push'
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Deploy current master
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not configured; skipping deployment."
            exit 0
          fi
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"
          printf '%s\n' '192.168.10.11 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILTMnlpZIxJ2osrYao9x6uwuel/cCZn5tnB5w5VVCV4/' > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            homelab-signage-deploy@192.168.10.11
          curl --fail --silent --show-error --max-time 10 http://192.168.10.118:8080/api/clearCache
          curl --fail --silent --show-error --max-time 10 http://192.168.10.118:8080/api/reload
