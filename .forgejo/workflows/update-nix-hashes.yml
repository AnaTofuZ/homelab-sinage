name: Update Nix dependency hashes

on:
  push:
    branches: [master]
    paths:
      - go.mod
      - go.sum
      - .forgejo/workflows/update-nix-hashes.yml

permissions:
  contents: write

concurrency:
  group: nix-dependency-hashes-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  update:
    uses: anatofuz/forgejo-actions/.forgejo/workflows/update-nix-hashes.yml@main
    secrets: inherit
