name: Update Nix dependency hashes

on:
  push:
    paths:
      - flake.lock
      - go.mod
      - go.sum
      - package-lock.json
      - scripts/update-nix-hashes.sh
      - .forgejo/workflows/update-nix-hashes.yml

permissions:
  contents: write

concurrency:
  group: nix-dependency-hashes-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: docker
    timeout-minutes: 15
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          ref: ${{ forgejo.ref_name }}
      - name: Install sudo
        run: |
          apt-get update
          apt-get install --yes sudo
      - uses: https://github.com/cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.NIX_GITHUB_TOKEN }}
          extra_nix_config: |
            fallback = true
            extra-substituters = https://nix-cache.home.anatofuz.net/shirane
            extra-trusted-public-keys = shirane-1:no8MT22B4VtEfZqtfOw49lYO2knMmA5F1xwDoixyEms=
      - name: Publish Nix build results to shared cache
        continue-on-error: true
        if: forgejo.event_name == 'push' && forgejo.ref == 'refs/heads/master'
        uses: https://github.com/ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0
        with:
          endpoint: https://nix-cache.home.anatofuz.net/
          cache: shirane
          skip-use: "true"
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
      - run: ./scripts/update-nix-hashes.sh
      - name: Commit and push
        run: |
          if git diff --quiet -- flake.nix; then
            exit 0
          fi
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.local"
          git add flake.nix
          git commit -m "fix: update Nix dependency hashes"
          git push
